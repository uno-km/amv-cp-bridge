<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>amv-cp-bridge Sidecar</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="sidecar-container">
    <!-- Header -->
    <header class="sidecar-header">
      <div class="brand-group">
        <span class="brand-bolt">⚡</span>
        <div class="brand-text">
          <div class="brand-title">amv-cp-bridge</div>
        </div>
      </div>
      <div class="header-actions">
        <span class="status-conn" id="statusPill">
          <span class="status-dot"></span>
        </span>
        <button type="button" class="icon-btn" id="settingsBtn" title="게이트웨이 설정">⚙</button>
        <button type="button" class="icon-btn" id="clearBtn" title="대화 내용 지우기">🗑</button>
      </div>
    </header>

    <!-- Settings Modal / Bar (Hidden by default) -->
    <div class="settings-drawer" id="settingsDrawer" style="display: none;">
      <div class="settings-row">
        <label for="gatewayUrlInput">Gateway URL:</label>
        <input type="text" id="gatewayUrlInput" value="http://127.0.0.1:11500/v1" placeholder="http://127.0.0.1:11500/v1">
      </div>
      <div class="settings-row">
        <label for="modelSelect">추론 모드:</label>
        <select id="modelSelect">
          <option value="copilot-auto" selected>자동 (Auto)</option>
          <option value="copilot-fast">빠름 (Fast)</option>
          <option value="copilot-deep">깊게 (Deep)</option>
          <option value="sol-5.6-quick">Sol 5.6 Quick</option>
          <option value="sol-5.6-deep">Sol 5.6 Deep Thinking</option>
        </select>
      </div>
      <div class="settings-actions">
        <button type="button" class="btn-primary-sm" id="saveSettingsBtn">저장 및 닫기</button>
        <button type="button" class="btn-secondary-sm" id="testGatewayBtn">연결 테스트</button>
      </div>
    </div>

    <!-- Chat Messages -->
    <main class="chat-viewport" id="chatViewport">
      <div class="welcome-card" id="welcomeCard">
        <div class="welcome-icon">⚡</div>
        <h3>amv-cp-bridge</h3>
        <p>M365 Copilot에게 무엇이든 바로 질문하세요.</p>
      </div>
    </main>

    <!-- Input Footer -->
    <footer class="sidecar-footer">
      <form class="input-form" id="chatForm">
        <textarea
          id="promptInput"
          placeholder="Copilot 365에게 무엇이든 질문하세요... (Enter 전송, Shift+Enter 줄바꿈)"
          rows="1"
          required
        ></textarea>
        <button type="submit" class="send-btn" id="sendBtn" title="전송 (Enter)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </form>
      <div class="footer-meta">
        <span>엔진: <strong id="currentModelLabel">GPT-5.6 Sol</strong></span>
      </div>
    </footer>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
