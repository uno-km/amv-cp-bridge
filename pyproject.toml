[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amv-cp-bridge"
dynamic = ["version"]
description = "Sovereign Cognitive Offloading Suite & Zero-Leak REST/MCP Gateway for Microsoft 365 Copilot"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0 OR Commercial-License" }
authors = [{ name = "Eunho Kim", email = "contact@uno-km.com" }]
keywords = [
  "amv-cp-bridge",
  "mcp",
  "copilot",
  "m365",
  "cognitive-offloading",
  "zero-leak",
  "llm-gateway",
  "openai-compatible",
  "telemetry",
  "dashboard",
  "playwright"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]
dependencies = [
  "playwright>=1.40.0",
  "mcp>=1.0.0,<2",
  "fastapi>=0.100.0",
  "uvicorn>=0.22.0",
  "customtkinter>=5.2.0",
  "Pillow>=10.0.0",
  "markdown2>=2.4.0",
  "tkinterweb>=3.23.0",
  "pystray>=0.19.5",
  "certifi>=2024.2.2"
]

[project.scripts]
amv-cp-bridge = "amv_cp_bridge.cli:main"
acb = "amv_cp_bridge.cli:main"
c365 = "amv_cp_bridge.cli:main"
copilot-bridge = "amv_cp_bridge.cli:main"

[tool.setuptools.dynamic]
version = { attr = "amv_cp_bridge._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["amv_cp_bridge*"]
