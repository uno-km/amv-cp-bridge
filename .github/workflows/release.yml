name: Build and Publish EXE Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
          $env:PYTHONPATH = "."
          python -m pytest tests/ -q

      - name: Build & self-test amv-cp-bridge.exe
        run: |
          python scripts/build/build_exe.py

      - name: Package browser extension zip
        run: |
          Compress-Archive -Path extension\* -DestinationPath dist\amv-cp-bridge-extension.zip -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/amv-cp-bridge.exe
            dist/amv-cp-bridge.exe.sha256
            dist/amv-cp-bridge-extension.zip
            dist/build_report.json
